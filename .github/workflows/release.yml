name: Release

# Релиз создаётся двумя способами:
#   1) Вручную: Actions → Release → Run workflow → выбрать bump (patch/minor/major/none).
#      Workflow поднимает версию и билд, коммитит, ставит тег, собирает .app и публикует Release.
#   2) Пушем тега вида vX.Y.Z (например, git tag v3.0.2 && git push origin v3.0.2).
#      В этом случае версия берётся из тега, а bump не выполняется.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: "Как поднять версию перед релизом"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Крупные ресурсы (xray-core, geoip.dat, geosite.dat) — в Git LFS.
          lfs: true
          fetch-depth: 0

      - name: Show toolchain
        run: |
          xcodebuild -version
          git --version

      - name: Bump version
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: scripts/bump_version.sh --${{ inputs.bump }}

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(awk -F'= ' '/MARKETING_VERSION/ { gsub(/;/,"",$2); gsub(/[[:space:]]/,"",$2); print $2; exit }' KnowerManager.xcodeproj/project.pbxproj)"
          fi
          B="$(awk -F'= ' '/CURRENT_PROJECT_VERSION/ { gsub(/;/,"",$2); print $2; exit }' KnowerManager.xcodeproj/project.pbxproj)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "build=$B" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "→ Значение для релиза: v$V (build $B)"

      - name: Commit & push version bump
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KnowerManager.xcodeproj/project.pbxproj CHANGELOG.md
          git commit -m "chore(release): v${{ steps.ver.outputs.version }} (build ${{ steps.ver.outputs.build }})"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild \
            -project KnowerManager.xcodeproj \
            -scheme KnowerManager \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild \
            -project KnowerManager.xcodeproj \
            -scheme KnowerManager \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .app
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release/KnowerManager.app"
          ditto -c -k --keepParent "$APP" "KnowerManager-v${{ steps.ver.outputs.version }}.zip"
          ls -lh "KnowerManager-v${{ steps.ver.outputs.version }}.zip"

      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            "KnowerManager-v${{ steps.ver.outputs.version }}.zip" \
            --title "KnowerManager v${{ steps.ver.outputs.version }} (build ${{ steps.ver.outputs.build }})" \
            --generate-notes
